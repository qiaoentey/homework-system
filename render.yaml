services:
  - type: web
    name: daycare-checkin-optimized
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build && npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: daycare-checkin-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: daycare-checkin-db
    plan: basic-256mb
    databaseName: daycare
