name: Homework checker CI

on:
  push:
    paths:
      - "homework-checker/**"
      - ".github/workflows/homework-checker-ci.yml"
      - ".github/workflows/homework-checker-pages.yml"
  pull_request:
    paths:
      - "homework-checker/**"
      - ".github/workflows/homework-checker-ci.yml"
      - ".github/workflows/homework-checker-pages.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homework-checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: homework-checker/package-lock.json
      - name: Install answer PDF validation dependencies
        run: python -m pip install -r requirements-answer-pdf.txt
      - name: Install locked dependencies
        run: npm ci
      - name: Validate answer datasets
        run: npm run test:answers
      - name: Validate committed answer PDFs
        run: npm run verify:answers
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Block high-severity production dependency advisories
        run: npm audit --audit-level=high
      - name: Install supported browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Mobile, offline, privacy, and real-worker browser tests
        run: npm run test:e2e
      - name: Project-base Pages browser tests
        run: npm run test:e2e:pages
